name: AI DevOps Agent

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Failed repo (owner/name)"
        required: true
        type: string
      run_id:
        description: "Failed workflow run ID"
        required: true
        type: string

# One independent run per (repo, run_id); different repos never block each other.
concurrency:
  group: ai-agent-${{ inputs.repository }}-${{ inputs.run_id }}
  cancel-in-progress: false

permissions:
  contents: read   

jobs:
  analyze:
    runs-on: ubuntu-latest   0
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent

        env:
          TARGET_REPO: ${{ inputs.repository }}
          TARGET_RUN_ID: ${{ inputs.run_id }}
          AGENT_GITHUB_TOKEN: ${{ secrets.AGENT_GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALLOWED_OWNERS: ${{ vars.ALLOWED_OWNERS }}   # optional
        run: python agent.py
